# infra/infra-node-01/adguardhome/docker-compose.yml
#
# AdGuard Home: local DNS resolver + DNS rewrites for LAN hostnames
# (e.g. openwebui.homelab.local), resolving the open ADR 0009 follow-up.
# See docs/decisions/0013 for why AdGuard Home + Docker + this node.
#
# Data persists in ./work and ./conf (next to this file, NOT inside the
# git repo's tracked content — see .gitignore in this directory).
#
# Deploy:
#   cd infra/infra-node-01/adguardhome
#   docker compose up -d
#
# First-run setup wizard: http://<node-ip>:3000 — after setup completes,
# AdGuard Home switches the admin UI to whatever port you picked in the
# wizard (this deployment ended up on 80, not 3000 as originally
# intended — both are published below so it works either way). DNS
# itself is always on 53.

services:
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "3000:3000/tcp"
      - "80:80/tcp"
    volumes:
      - ./work:/opt/adguardhome/work
      - ./conf:/opt/adguardhome/conf
