# infra/infra-node-01/vikunja/docker-compose.yml
#
# Vikunja: lightweight backlog/Kanban board for tracking homelab work
# (ADR follow-ups, on-the-horizon items, incidents to revisit). Runs on
# infra-node-01, not the k3s cluster — deliberately independent of the
# thing it's used to track work for, same reasoning as AdGuard Home
# (see docs/decisions/0013).
#
# Database: migrated from local SQLite to the shared Postgres cluster
# 2026-08-31 -- see ADR 0021 for the full reasoning, including the real
# tradeoff accepted (Vikunja is no longer usable during a control-plane-01/
# k3s/Postgres outage, which cuts against this very directory's original
# "independent of the cluster" design goal). Reached over the LAN via the
# NodePort added in ADR 0020 (192.168.0.47:30432), since infra-node-01 is
# outside the k3s cluster and has no in-cluster Service DNS to use.
#
# GOTCHA: VIKUNJA_DATABASE_PORT is silently ignored for a postgres
# connection (confirmed against Vikunja v2.5.0 -- ran `vikunja migrate`
# with DATABASE_PORT set to 30432 and it still tried port 5432). The
# working fix is embedding the port directly in DATABASE_HOST as
# "host:port" instead, which is why VIKUNJA_DATABASE_PORT is absent below
# rather than just set to 30432 -- that would silently not work.
#
# Data persists in ./data (next to this file, NOT inside the git repo's
# tracked content — see .gitignore in this directory). The old SQLite
# database is archived at ./data/db/vikunja.db.pre-postgres-migration-backup-20260831
# as a rollback path, not deleted.
#
# Requires a .env file (also gitignored, not checked in) next to this
# file with a random JWT signing secret AND the Postgres role's password
# (see infra/k8s/base/postgres/04-vikunja-role-db.yaml for how that role
# was created):
#   echo "VIKUNJA_JWT_SECRET=$(openssl rand -base64 32)" >> .env
#   echo "VIKUNJA_DATABASE_PASSWORD=<the vikunja role's password>" >> .env
#
# Deploy:
#   cd infra/infra-node-01/vikunja
#   docker compose up -d
#
# Web UI: http://192.168.0.82:3456 (or http://kanban.homelab.local:3456
# once the AdGuard Home DNS rewrite is added — see this directory's
# README).
#
# IMPORTANT: don't mount a host volume straight onto /app/vikunja. The
# image's own `vikunja` binary lives at /app/vikunja/vikunja — a bind
# mount at that exact path shadows the whole directory (including the
# binary) with the host dir's contents, so the container fails with
# "exec: /app/vikunja/vikunja: no such file or directory". Mount only
# the specific subpaths that actually need to persist instead.
#
# IMPORTANT: the Vikunja process runs as uid 1000 inside the container.
# If Docker auto-creates ./data/files and ./data/db (i.e. they don't
# already exist before the first `docker compose up`), it creates them
# as root, and the container then fails with "permission denied"
# trying to write its own files. Create + chown them first — see this
# directory's section in the top-level infra-node-01 README.

services:
  vikunja:
    image: vikunja/vikunja:latest
    container_name: vikunja
    restart: unless-stopped
    ports:
      - "3456:3456"
    environment:
      # IMPORTANT: this must be a hostname/IP that actually resolves for
      # whatever client is using the UI — the frontend uses this as the
      # base URL for its own API calls (registration, login, everything),
      # not just for links. Confirmed working via the AdGuard Home DNS
      # rewrite (kanban.homelab.local -> 192.168.0.82) as of 2026-08-22 —
      # but this only resolves for clients that actually query AdGuard
      # Home for DNS (either pointed at it directly, like the Dell G5 is,
      # or once the router is in bridge mode and DHCP-wide DNS is set —
      # see docs/decisions/0014 and the AdGuard Home section above). A
      # client without that will get a "network error" on every API call
      # again — fall back to http://192.168.0.82:3456/ for such a client
      # rather than assuming the hostname just works everywhere.
      VIKUNJA_SERVICE_PUBLICURL: "http://kanban.homelab.local:3456/"
      VIKUNJA_SERVICE_SECRET: "${VIKUNJA_JWT_SECRET}"
      VIKUNJA_DATABASE_TYPE: postgres
      # Port embedded in the host string, NOT a separate DATABASE_PORT --
      # see the GOTCHA note above.
      VIKUNJA_DATABASE_HOST: "192.168.0.47:30432"
      VIKUNJA_DATABASE_DATABASE: vikunja
      VIKUNJA_DATABASE_USER: vikunja
      VIKUNJA_DATABASE_PASSWORD: "${VIKUNJA_DATABASE_PASSWORD}"
      VIKUNJA_DATABASE_SSLMODE: disable
    volumes:
      - ./data/files:/app/vikunja/files
      - ./data/db:/db
