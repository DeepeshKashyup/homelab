# Helm values for prometheus-community/kube-prometheus-stack
# Deploy: helm install prometheus prometheus-community/kube-prometheus-stack \
#           -n monitoring --create-namespace -f infra/k8s/base/monitoring/values.yaml
#
# Motivated by the recurring gpu-node-01 GPU hang incidents (see docs/decisions and
# CLAUDE.md's "On the horizon" list) -- this is the "real graphs" stack that
# infra/gpu-node-01/gpu-temp-exporter/README.md explicitly deferred. Uptime Kuma
# (infra/infra-node-01/uptime-kuma/) stays as-is for simple up/down alerting;
# this stack is for time-series graphing (temp, VRAM, wattage over time).
#
# Keeps Prometheus/Grafana/Alertmanager pinned to control-plane-01 so they never
# contend with gpu-node-01's single-GPU Ollama/ComfyUI toggle for CPU/RAM.
# node-exporter is a DaemonSet by chart default and intentionally runs on both
# nodes (that's the point -- host-level CPU/mem/disk from each).

grafana:
  service:
    type: NodePort
    nodePort: 30300
  persistence:
    enabled: true
    storageClassName: local-path
    size: 2Gi
  nodeSelector:
    kubernetes.io/hostname: control-plane-01
  # adminPassword intentionally NOT set here -- this repo is public on GitHub.
  # Chart auto-generates one into the `prometheus-grafana` Secret; retrieve with:
  #   kubectl get secret prometheus-grafana -n monitoring -o jsonpath="{.data.admin-password}" | base64 -d

prometheus:
  prometheusSpec:
    retention: 15d
    nodeSelector:
      kubernetes.io/hostname: control-plane-01
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
    # gpu-node-01's nvidia_gpu_exporter runs as a systemd service on the host
    # (infra/gpu-node-01/nvidia-gpu-exporter/), NOT a k8s workload -- deploying it
    # in-cluster would mean requesting the nvidia.com/gpu device-plugin resource,
    # which has capacity 1 and would permanently block Ollama/ComfyUI's toggle
    # from ever scheduling. Scraped here as a plain static target instead.
    additionalScrapeConfigs:
      - job_name: "nvidia-gpu-exporter"
        static_configs:
          - targets: ["192.168.0.79:9835"]
            labels:
              node: gpu-node-01

alertmanager:
  alertmanagerSpec:
    nodeSelector:
      kubernetes.io/hostname: control-plane-01

prometheusOperator:
  nodeSelector:
    kubernetes.io/hostname: control-plane-01

kube-state-metrics:
  nodeSelector:
    kubernetes.io/hostname: control-plane-01
