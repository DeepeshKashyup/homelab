apiVersion: v1
kind: ConfigMap
metadata:
  name: gpu-node-correlation-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  gpu-node-correlation.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": { "type": "grafana", "uid": "-- Grafana --" },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "type": "row",
          "title": "GPU compute health (nvidia_gpu_exporter, gpu-node-01)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 100,
          "collapsed": false,
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "GPU Temperature",
          "description": "nvidia_smi_temperature_gpu. Orange ~ typical throttle territory, red ~ typical shutdown territory for this class of consumer card.",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 1 },
          "id": 1,
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 15,
                "thresholdsStyle": { "mode": "line" }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 83 },
                  { "color": "red", "value": 90 }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "nvidia_smi_temperature_gpu",
              "legendFormat": "GPU temp",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "GPU Power Draw",
          "description": "nvidia_smi_power_draw_watts against this card's 180W cap.",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 1 },
          "id": 2,
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 15,
                "thresholdsStyle": { "mode": "line" }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 180 }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "nvidia_smi_power_draw_watts",
              "legendFormat": "GPU power draw",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "GPU VRAM",
          "description": "nvidia_smi_memory_used_bytes vs memory_total_bytes. This stayed well-behaved even during the Aug 25 crash â€” it was never the problem.",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 1 },
          "id": 3,
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 15
              }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "VRAM total (card capacity)" },
                "properties": [
                  { "id": "custom.lineStyle", "value": { "dash": [10, 10], "fill": "dash" } },
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } }
                ]
              }
            ]
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "nvidia_smi_memory_used_bytes",
              "legendFormat": "VRAM used",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "nvidia_smi_memory_total_bytes",
              "legendFormat": "VRAM total (card capacity)",
              "refId": "B"
            }
          ]
        },
        {
          "type": "row",
          "title": "Host memory on gpu-node-01 (the metric that actually caught the Aug 25 crash â€” see ADR 0018)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 9 },
          "id": 101,
          "collapsed": false,
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Pod Host Memory vs Node RAM Capacity",
          "description": "container_memory_working_set_bytes per namespace on gpu-node-01. Dashed lines mark the new 24Gi container limit (ADR 0018) and the node's total 30GB physical RAM â€” crossing the red line is what actually took the node down on Aug 25, while GPU temp/power (left) looked completely normal.",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 10 },
          "id": 4,
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "thresholdsStyle": { "mode": "dashed" }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 25769803776 },
                  { "color": "red", "value": 32212254720 }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["max", "last"] },
            "tooltip": { "mode": "multi" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(container_memory_working_set_bytes{namespace=\"comfyui\"})",
              "legendFormat": "comfyui pod (host RAM)",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(container_memory_working_set_bytes{namespace=\"ollama\"})",
              "legendFormat": "ollama pod (host RAM)",
              "refId": "B"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "gpu-node-01 Available Memory",
          "description": "node_memory_MemAvailable_bytes for gpu-node-01 specifically â€” the whole-node view behind the per-pod panel above.",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 20 },
          "id": 5,
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 15
              }
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "node_memory_MemAvailable_bytes{instance=\"192.168.0.79:9100\"}",
              "legendFormat": "gpu-node-01 available RAM",
              "refId": "A"
            }
          ]
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": ["gpu", "homelab", "incident"],
      "templating": { "list": [] },
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "timezone": "",
      "title": "GPU Node: Compute vs Host Memory",
      "uid": "gpu-node-correlation",
      "version": 1
    }
