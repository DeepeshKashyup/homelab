# n8n's own database + role on the shared Postgres cluster (infra/k8s/base/
# postgres/), per that directory's README ("Adding a database for a new
# app" — don't reuse the bootstrap "app" database/role).
#
# Lives in the `postgres` namespace, not `n8n` — CNPG's Database/DatabaseRole
# CRDs are namespaced alongside the Cluster they target, not the app that
# consumes them.
#
# - passwordSecret references a Secret that is NOT checked in here (same
#   practice as Plex's PLEX_CLAIM and CNPG's own auto-generated app
#   credentials) — create it once, out of band, before applying this file:
#
#     PASS=$(openssl rand -base64 24)
#     kubectl create secret generic n8n-db-owner -n postgres \
#       --type=kubernetes.io/basic-auth \
#       --from-literal=username=n8n --from-literal=password="$PASS"
#
#   n8n's own Deployment (02-n8n.yaml) needs the *same* password in a second
#   Secret in the n8n namespace (Secrets don't cross namespaces) — see this
#   directory's README for the exact second command.
# - login: true so n8n can actually authenticate as this role (DatabaseRole
#   defaults login to false — it's built for permission-only roles too).

apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: n8n
  namespace: postgres
spec:
  cluster:
    name: postgres
  name: n8n
  login: true
  passwordSecret:
    name: n8n-db-owner
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: n8n
  namespace: postgres
spec:
  cluster:
    name: postgres
  name: n8n
  owner: n8n
