# Open WebUI: browser UI for Ollama, running as an orchestration-layer app.
#
# - nodeSelector pins it to control-plane-01, deliberately keeping it off
#   gpu-node-01 (see CLAUDE.md's deferred-taint note — this is a first,
#   concrete step toward that separation without needing a cluster-wide
#   taint policy yet).
# - Talks to Ollama over the in-cluster Service DNS name, not the NodePort.
# - WEBUI_AUTH stays at its default (enabled) since this is reachable by
#   anything on the LAN via NodePort — first user to sign up becomes admin.
# - Exposed via NodePort per ADR 0009 (interim, pre-Ingress).
# - DATABASE_URL points at the shared Postgres cluster (see
#   03-postgres-role-db.yaml) instead of Open WebUI's default embedded
#   SQLite -- migrated 2026-08-30 as a deliberate fresh start (Open WebUI
#   doesn't auto-migrate old SQLite data into a newly-connected Postgres
#   DB), so this folds chat/user data into the same weekly pg_dumpall
#   backup coverage Postgres already gets, instead of an unbacked-up PVC.
#   Username/password come from openwebui-db-credentials (Secret, created
#   out of band -- see this directory's README), interpolated into the
#   connection string via Kubernetes' $(VAR) env substitution rather than
#   one Secret key holding the whole URL.

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-data
  namespace: ollama
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: ollama
spec:
  replicas: 1
  strategy:
    type: Recreate # local-path PVC is ReadWriteOnce; avoid two pods fighting over it
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      nodeSelector:
        kubernetes.io/hostname: control-plane-01
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:main
          ports:
            - containerPort: 8080
          env:
            - name: OLLAMA_BASE_URL
              value: http://ollama.ollama.svc.cluster.local:11434
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: openwebui-db-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openwebui-db-credentials
                  key: password
            - name: DATABASE_URL
              value: "postgresql://$(DB_USER):$(DB_PASSWORD)@postgres-rw.postgres.svc.cluster.local:5432/openwebui"
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: ollama
spec:
  type: NodePort
  selector:
    app: open-webui
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
