# ComfyUI: GPU-scheduled image (and later, video) generation on gpu-node-01.
#
# - Image: ghcr.io/ai-dock/comfyui:latest-cuda — actively maintained,
#   CUDA-tagged build, works as a plain container (not locked to a
#   RunPod/vast.ai cloud context). Volume paths and env vars below are
#   per ai-dock's documented docker-compose example; VERIFY against the
#   pod's actual logs/filesystem on first deploy and adjust if the image
#   has since changed its layout — this is a first-pass deployment in the
#   same "deploy, observe, iterate" spirit as the rest of this cluster's
#   incident-driven fixes (see docs/decisions/0008, 0010, 0011).
# - nodeSelector pins it to gpu-node-01, same as Ollama (ADR 0008).
# - replicas: 0 by default. gpu-node-01 has one physical GPU and
#   Kubernetes only advertises one allocatable nvidia.com/gpu unit, so
#   Ollama and ComfyUI can't both hold a GPU reservation at the same time
#   as always-on Deployments. Scale this up (and Ollama down) manually
#   when testing image generation — see this directory's README for the
#   exact commands. Revisit if concurrent GPU sharing becomes a real need
#   (e.g. NVIDIA GPU time-slicing).
# - Exposed via NodePort per ADR 0009 (interim, pre-Ingress).
#
# SECURITY: this image is built for cloud GPU rental platforms and, by
# default, auto-creates PUBLIC internet tunnels (Cloudflare Quick
# Tunnels) exposing Jupyter, syncthing, SSH, and a service portal — with
# WEB_PASSWORD defaulting to the literal string "password". This was
# discovered live (briefly publicly exposed before being caught and
# scaled down) — see docs/decisions/0012 for the full incident writeup.
# The env vars below disable every one of those extras; only ComfyUI's
# own port (8188) is meant to be reachable, and only via our own
# NodePort — never re-add a service without checking whether it reopens
# a tunnel or a default credential.
#
# WEB_PASSWORD is deliberately NOT set here as a literal value — this
# repo is public. It's read from a Secret you create yourself (never
# committed to git):
#   kubectl create secret generic comfyui-web-auth \
#     --from-literal=WEB_PASSWORD='<a-strong-password-you-generate>' \
#     -n comfyui
# See docs/decisions/0012 and this directory's README for the full setup.

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: comfyui-models
  namespace: comfyui
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 40Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: comfyui-output
  namespace: comfyui
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: comfyui
  namespace: comfyui
spec:
  replicas: 0 # see note above — scale up manually, and scale ollama down first
  strategy:
    type: Recreate # local-path PVCs are ReadWriteOnce; avoid two pods fighting over them
  selector:
    matchLabels:
      app: comfyui
  template:
    metadata:
      labels:
        app: comfyui
    spec:
      nodeSelector:
        nvidia.com/gpu.present: "true"
      containers:
        - name: comfyui
          image: ghcr.io/ai-dock/comfyui:latest-cuda
          ports:
            - containerPort: 8188
          env:
            - name: AUTO_UPDATE
              value: "false"
            - name: CF_QUICK_TUNNELS
              value: "false" # the critical one — no public internet tunnels
            - name: SSH_PORT_HOST
              value: "" # disable SSH inside the container; unneeded, we use kubectl exec
            - name: SYNCTHING_UI_PORT_HOST
              value: "" # disable; unneeded
            - name: SYNCTHING_TRANSPORT_PORT_HOST
              value: "" # disable; unneeded
            - name: SERVICEPORTAL_PORT_HOST
              value: "" # disable; unneeded, we go straight to ComfyUI's own NodePort
            - name: WEB_ENABLE_AUTH
              value: "true" # explicit even though it's the default — defense in depth
            - name: WEB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: comfyui-web-auth
                  key: WEB_PASSWORD
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: models
              mountPath: /root/.comfy/models
            - name: output
              mountPath: /root/outputs
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: comfyui-models
        - name: output
          persistentVolumeClaim:
            claimName: comfyui-output
---
apiVersion: v1
kind: Service
metadata:
  name: comfyui
  namespace: comfyui
spec:
  type: NodePort
  selector:
    app: comfyui
  ports:
    - port: 8188
      targetPort: 8188
      nodePort: 30188
