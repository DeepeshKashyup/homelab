# ComfyUI: GPU-scheduled image (and later, video) generation on gpu-node-01.
#
# - Image: yanwk/comfyui-boot:cu130-slim-v2 — plain ComfyUI + ComfyUI-Manager,
#   no bundled Jupyter/syncthing/SSH/tunnel machinery. Switched to this from
#   ghcr.io/ai-dock/comfyui after that image caused THREE separate problems:
#   (1) auto-exposed public Cloudflare tunnels with a weak default password
#   (docs/decisions/0012, the actual security incident); (2) its Docker/
#   RunPod-specific port-advertisement automation didn't understand
#   Kubernetes' own auto-injected Service env vars, so ComfyUI never bound
#   anywhere reachable; (3) its bundled PyTorch (2.4.1+cu121) doesn't
#   support the RTX 5060 Ti's Blackwell (sm_120) architecture at all. This
#   image's cu130 tag explicitly supports Blackwell and has none of ai-dock's
#   vendor-specific automation to fight. See docs/decisions/0012 for the
#   full incident writeup (kept for the general lesson, even though the
#   specific WEB_PASSWORD/Secret machinery described there doesn't apply to
#   this image — it has no such auth layer to configure).
# - nodeSelector pins it to gpu-node-01, same as Ollama (ADR 0008).
# - replicas: 0 by default. gpu-node-01 has one physical GPU and
#   Kubernetes only advertises one allocatable nvidia.com/gpu unit, so
#   Ollama and ComfyUI can't both hold a GPU reservation at the same time
#   as always-on Deployments. Scale this up (and Ollama down) manually
#   when testing image generation — see this directory's README for the
#   exact commands. Revisit if concurrent GPU sharing becomes a real need
#   (e.g. NVIDIA GPU time-slicing).
# - Exposed via NodePort per ADR 0009 (interim, pre-Ingress). Requires the
#   NodePort range open in ufw on whichever node(s) serve it — see
#   infra/k8s/open-nodeport-firewall.sh.
# - memory request/limit: see ADR 0018. A dual-14B Wan2.2 generation drove
#   this pod's host RAM (not VRAM — a separate, unbounded thing ComfyUI's
#   dynamic CPU-offload staging can consume) to ~45-48GB with no limit set,
#   exceeding gpu-node-01's original 30GB RAM + 8GB swap and hard-crashing
#   the whole node (not just this pod). The limit below makes that fail as a
#   contained, visible pod OOM-kill/restart instead — it does NOT make that
#   specific dual-14B workflow succeed on this node's RAM; see ADR 0018's
#   follow-ups for what actually would.
#   2026-08-29: gpu-node-01 upgraded to 48GB RAM (see the 48GB-upgrade
#   commit) and the limit raised 30Gi -> 40Gi to use that headroom (~5GB
#   left for host OS + other pods on a 45Gi-usable node). Also switched the
#   dual-14B i2v workflow itself to the Q4_K_M GGUF quantized diffusion
#   models (~9.7GB each vs ~14.3GB fp8_scaled) via the newly-installed
#   ComfyUI-GGUF custom node, cutting weight footprint further so the two
#   fixes together should clear the ~45-48GB peak with margin. If it still
#   OOMs, ADR 0018's follow-ups cover further options (e.g. GGUF-quantizing
#   the text encoder too, or trimming CPU-offload staging).
# - custom_nodes is now on its own PVC (comfyui-custom-nodes), not baked
#   into the image or left on the container's ephemeral writable layer —
#   found the hard way: a custom node installed via `kubectl exec ... git
#   clone` into a running pod vanishes on the next restart (any restart,
#   not just an image change) because only models/ and output/ were ever
#   persistent. ComfyUI-GGUF is installed here now specifically so it
#   survives future restarts/reboots without a manual reinstall.

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: comfyui-models
  namespace: comfyui
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 40Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: comfyui-output
  namespace: comfyui
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: comfyui-custom-nodes
  namespace: comfyui
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: comfyui
  namespace: comfyui
spec:
  replicas: 1 # scaled up for image-to-video testing with 48GB RAM
  strategy:
    type: Recreate # local-path PVCs are ReadWriteOnce; avoid two pods fighting over them
  selector:
    matchLabels:
      app: comfyui
  template:
    metadata:
      labels:
        app: comfyui
    spec:
      nodeSelector:
        nvidia.com/gpu.present: "true"
      containers:
        - name: comfyui
          image: docker.io/yanwk/comfyui-boot:cu130-slim-v2
          ports:
            - containerPort: 8188
          env:
            - name: CLI_ARGS
              value: ""
          resources:
            requests:
              memory: 8Gi
            limits:
              nvidia.com/gpu: 1
              memory: 40Gi
          volumeMounts:
            - name: models
              mountPath: /root/ComfyUI/models
            - name: output
              mountPath: /root/ComfyUI/output
            - name: custom-nodes
              mountPath: /root/ComfyUI/custom_nodes
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: comfyui-models
        - name: output
          persistentVolumeClaim:
            claimName: comfyui-output
        - name: custom-nodes
          persistentVolumeClaim:
            claimName: comfyui-custom-nodes
---
apiVersion: v1
kind: Service
metadata:
  name: comfyui
  namespace: comfyui
spec:
  type: NodePort
  selector:
    app: comfyui
  ports:
    - port: 8188
      targetPort: 8188
      nodePort: 30188
